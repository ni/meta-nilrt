# Kernel configuration fragment for Secure Boot support
# This fragment enables all necessary kernel features for:
#   - UEFI Secure Boot
#   - Kernel module signing
#   - IMA/EVM integrity measurement and appraisal
#   - Trusted Platform Module (TPM) support

# =====================================================================
# UEFI Secure Boot Support
# =====================================================================
# Enable EFI stub for direct kernel boot from UEFI firmware
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_MIXED=y
CONFIG_EFI_VARS=y
CONFIG_EFI_VARS_PSTORE=y
CONFIG_EFIVAR_FS=y

# Enable UEFI runtime services
CONFIG_EFI_RUNTIME_MAP=y

# Enable loading MOK (Machine Owner Keys) from UEFI
CONFIG_LOAD_UEFI_KEYS=y
CONFIG_LOAD_IPL_KEYS=y

# =====================================================================
# Kernel Module Signing
# =====================================================================
# Enable cryptographic signature checking for kernel modules
# Note: Signing is enabled but not forced to allow building without valid keys
# Set CONFIG_MODULE_SIG_FORCE=y in production when you have proper signing keys
CONFIG_MODULE_SIG=y
# CONFIG_MODULE_SIG_FORCE is not set
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA256=y

# Signing key path - this will be set by the kernel build system
# Leave empty to allow the kernel to autogenerate keys
# Or set via KERNEL_EXTRA_ARGS in the recipe
CONFIG_MODULE_SIG_KEY="certs/signing_key.pem"
CONFIG_MODULE_SIG_KEY_TYPE_RSA=y

# Require signed kernel modules (disabled for now - enable in production)
# CONFIG_MODULE_SIG_FORCE_COMPAT is not set

# =====================================================================
# Kernel Lockdown Mode
# =====================================================================
# Enable kernel lockdown LSM for secure boot
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=y

# =====================================================================
# IMA (Integrity Measurement Architecture)
# =====================================================================
# Enable IMA for file integrity measurement
CONFIG_IMA=y
CONFIG_IMA_MEASURE_PCR_IDX=10
CONFIG_IMA_LSM_RULES=y
CONFIG_IMA_TEMPLATE=y
CONFIG_IMA_DEFAULT_TEMPLATE="ima-ng"
CONFIG_IMA_DEFAULT_HASH_SHA256=y
CONFIG_IMA_DEFAULT_HASH="sha256"
CONFIG_IMA_WRITE_POLICY=y
CONFIG_IMA_READ_POLICY=y
CONFIG_IMA_APPRAISE=y
CONFIG_IMA_APPRAISE_BOOTPARAM=y
CONFIG_IMA_APPRAISE_MODSIG=y
CONFIG_IMA_TRUSTED_KEYRING=y
CONFIG_IMA_KEYRINGS_PERMIT_SIGNED_BY_BUILTIN_OR_SECONDARY=y
CONFIG_IMA_LOAD_X509=y
CONFIG_IMA_X509_PATH=""
CONFIG_IMA_APPRAISE_SIGNED_INIT=y
CONFIG_IMA_MEASURE_ASYMMETRIC_KEYS=y
CONFIG_IMA_QUEUE_EARLY_BOOT_KEYS=y
CONFIG_IMA_SECURE_AND_OR_TRUSTED_BOOT=y

# =====================================================================
# EVM (Extended Verification Module)
# =====================================================================
# Enable EVM for extended file metadata verification
CONFIG_EVM=y
CONFIG_EVM_ATTR_FSUUID=y
CONFIG_EVM_EXTRA_SMACK_XATTRS=y
CONFIG_EVM_ADD_XATTRS=y
CONFIG_EVM_LOAD_X509=y
CONFIG_EVM_X509_PATH=""

# =====================================================================
# Cryptographic Support for Integrity
# =====================================================================
# Required crypto algorithms for signing/verification
CONFIG_CRYPTO_RSA=y
CONFIG_CRYPTO_SHA256=y
# SHA512 needs to be a module for packagegroup-kernel-modules-essential
CONFIG_CRYPTO_SHA512=m
CONFIG_ASYMMETRIC_KEY_TYPE=y
CONFIG_ASYMMETRIC_PUBLIC_KEY_SUBTYPE=y
CONFIG_X509_CERTIFICATE_PARSER=y
CONFIG_PKCS7_MESSAGE_PARSER=y
CONFIG_PKCS7_TEST_KEY=y
CONFIG_SIGNED_PE_FILE_VERIFICATION=y
CONFIG_SYSTEM_TRUSTED_KEYRING=y
CONFIG_SYSTEM_TRUSTED_KEYS=""
CONFIG_SYSTEM_EXTRA_CERTIFICATE=y
CONFIG_SYSTEM_EXTRA_CERTIFICATE_SIZE=4096
CONFIG_SECONDARY_TRUSTED_KEYRING=y
CONFIG_SYSTEM_BLACKLIST_KEYRING=y
CONFIG_SYSTEM_BLACKLIST_HASH_LIST=""
CONFIG_SYSTEM_REVOCATION_LIST=y
CONFIG_SYSTEM_REVOCATION_KEYS=""

# =====================================================================
# TPM Support (for storing measurements)
# =====================================================================
# TPM 2.0 support (already enabled in NILRT for x64)
CONFIG_TCG_TPM=y
CONFIG_HW_RANDOM_TPM=y
CONFIG_TCG_TIS_CORE=y
CONFIG_TCG_TIS=y
CONFIG_TCG_TIS_SPI=y
CONFIG_TCG_TIS_I2C_CR50=y
CONFIG_TCG_CRB=y
CONFIG_TCG_VTPM_PROXY=y
CONFIG_TCG_TIS_ST33ZP24_I2C=y
CONFIG_TCG_TIS_ST33ZP24_SPI=y

# =====================================================================
# Security File Systems
# =====================================================================
# Security filesystem for IMA/EVM runtime control
CONFIG_SECURITYFS=y

# =====================================================================
# Additional Security Features
# =====================================================================
# Enable dm-verity for verified block devices (optional but recommended)
CONFIG_DM_VERITY=y
CONFIG_DM_VERITY_FEC=y
CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG=y

# Enable audit subsystem for security events
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y

# Enable security LSMs
CONFIG_SECURITY=y
CONFIG_SECURITY_NETWORK=y
CONFIG_SECURITY_PATH=y
CONFIG_LSM="lockdown,yama,integrity,selinux"
