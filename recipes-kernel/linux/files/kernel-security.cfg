# NILRT kernel memory-safety hardening (work item 3983223).
# Keep allocator initialization and IOMMU enforcement out of this baseline
# until RT performance and NI driver compatibility have been validated.
CONFIG_FORTIFY_SOURCE=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_STRICT_KERNEL_RWX=y
CONFIG_SYN_COOKIES=y
