set timeout=0
set timeout_style="menu"

set linux_console="console=tty0 console=ttyS0,115200n8"
set linux_verbosity="debug"
set linux_args="efi_no_storage_paranoia"

set root_device_fslabel=""
probe --set root_device_fslabel --label "$root"

set root_device_fsuuid=""
probe --set root_device_fsuuid --fs-uuid "$root"

load_env --skip-sig -f /grub/grubenv consoleoutenable serial_port GRUB_SERIAL_BASE_CLOCK usbgadgetethaddr USBVendorID USBProductID SerialNum USBDevice USBProduct hostname

source /runmode/bootimage.cfg

if [ -z "$usbgadgetethaddr" ]; then
    unset usb_gadget_args
fi

 for cfg_d_file in /runmode/bootimage.cfg.d/*.cfg; do
     if [ -f "$cfg_d_file" ]; then
         source "$cfg_d_file"
     fi
done

menuentry "NI Linux RT ($root_device_fslabel, $root_device_fsuuid)" {
    linux /bzImage rootfstype=ramfs rauc.slot=$root_device_fslabel rauc.slot.uuid=$root_device_fsuuid $linux_console $linux_verbosity $linux_args $otherbootargs $usb_gadget_args $consoleparam $othbootargs
    initrd /initrd.cpio.gz
    boot
}
