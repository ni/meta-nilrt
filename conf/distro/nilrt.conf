DISTRO_NAME = "NI Linux Real-Time"

DISTRO_VERSION = "11.6"

DISTRO_CODENAME = "${LAYERSERIES_COMPAT_meta-nilrt}"

NILRT_FEED_NAME ?= "2026Q3"

DISTRO_FEATURES:append:x64 = "\
        x11 \
        opengl \
        create-spdx \
"

INHERIT += " create-spdx "

# Mesa requires LLVM AMDGPU and SPIRV targets (CMake list, use semicolons).
LLVM_TARGETS_TO_BUILD:append = ";AMDGPU;SPIRV"

VIRTUAL-RUNTIME_mountpoint ?= "busybox"

SKIP_META_SECURITY_SANITY_CHECK = "1"

SKIP_META_TPM_SANITY_CHECK:xilinx-zynq = "1"

KERNEL_IMAGEDEST:xilinx-zynq = "boot"
# on older NILRT distro flavors the kernel is installed in non-standard paths
# for backward compatibility
KERNEL_IMAGEDEST:x64 = "boot/runmode"

# The IMAGE_FSTYPES to use for runmode rootfs that ends up in BSI.
# Use tar.gz on x64 for old safemode compatibility.
NILRT_BSI_FSTYPE:x64 = "tar.gz"
# Use tar.xz on ARM to save space and prevent BSI installation failure.
NILRT_BSI_FSTYPE:xilinx-zynq = "tar.xz"

# Needs to change thanks to NIAuth
# - cf oe-core base-files/base-files/profile
# - cf oe-core base-files/base-files_3.0.14.bb
ROOT_HOME = "/home/admin"

IMAGE_LINGUAS ?= "en-us en-us.iso-8859-1 ja-jp.windows-31j zh-cn.cp936"

require nilrt.inc
