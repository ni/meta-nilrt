# NI Linux Real-Time default kernel hardening settings.
#
# Applied at boot by /etc/init.d/nisysctlhardening, before /etc/sysctl.conf.
# Standard interface renaming runs first so overrides use final interface names.
# To override a setting, add it to /etc/sysctl.conf or to a later-sorting
# file in /etc/sysctl.d/ (for example 99-local.conf), then reboot.
# IPv6 is loaded before these settings are applied. To override IPv4 or IPv6
# redirect handling on an existing interface, set its interface-specific sysctl
# as well as the corresponding default sysctl for future interfaces.

# Hide kernel pointers from processes without CAP_SYSLOG.
kernel.kptr_restrict = 1

# Restrict reading the kernel log to processes with CAP_SYSLOG.
kernel.dmesg_restrict = 1

# Mitigate symlink and hardlink attacks in world-writable sticky directories.
# fs.protected_fifos and fs.protected_regular are intentionally left at 0:
# NI services share files in /tmp across users (for example root writing
# /tmp/ni_boot_mode_input, owned by lvuser), which those settings block.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Harden the BPF JIT against JIT spraying and hide JIT images from kallsyms.
net.core.bpf_jit_harden = 2
net.core.bpf_jit_kallsyms = 0

# Ignore ICMP redirects and source-routed packets; do not send redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Reject IPv6 routing headers, including type 2 used by Mobile IPv6.
net.ipv6.conf.all.accept_source_route = -1
net.ipv6.conf.default.accept_source_route = -1

# Protect against SYN flood attacks.
net.ipv4.tcp_syncookies = 1
