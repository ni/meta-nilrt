# Embedded in both bootimage configs so every grubenv load, including backups,
# passes through validation before any USB gadget kernel arguments are built.
unset usb_gadget_args
if [ -n "$usbgadgetethaddr" ]; then
    insmod regexp
    set usb_gadget_valid=1
    if ! regexp '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$' "$usbgadgetethaddr"; then
        set usb_gadget_valid=0
    fi
    if ! regexp '^(0[xX])?[0-9A-Fa-f]{1,4}$' "$USBVendorID"; then
        set usb_gadget_valid=0
    fi
    if ! regexp '^(0[xX])?[0-9A-Fa-f]{1,4}$' "$USBProductID"; then
        set usb_gadget_valid=0
    fi
    if ! regexp '^(0[xX])?[0-9A-Fa-f]{1,4}$' "$USBDevice"; then
        set usb_gadget_valid=0
    fi
    if ! regexp '^[A-Za-z0-9._-]+$' "$SerialNum"; then
        set usb_gadget_valid=0
    fi
    if ! regexp '^[A-Za-z0-9._-]*$' "$hostname"; then
        set usb_gadget_valid=0
    fi
    if ! regexp '^[A-Za-z0-9][A-Za-z0-9 ._()+/-]*$' "$USBProduct"; then
        set usb_gadget_valid=0
    fi
    if [ "$usb_gadget_valid" = 1 ]; then
        # Literal kernel-command-line quotes preserve spaces in product names.
        # The allowlists exclude quotes and backslashes in all imported values.
        set usb_gadget_args="g_ether.idVendor=${USBVendorID} g_ether.idProduct=${USBProductID} g_ether.iProduct=\"${USBProduct}[${hostname}]\" g_ether.iSerialNumber=${SerialNum} g_ether.dev_addr=${usbgadgetethaddr} g_ether.bcdDevice=${USBDevice}"
    else
        echo "ERROR: invalid USB gadget settings in grubenv; USB gadget arguments disabled."
    fi
    unset usb_gadget_valid
fi
