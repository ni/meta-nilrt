# This config DISABLES all mitigations for CPU vulnerabilities.
#
# NI Linux Real-Time ships this file as 'cpu-mitigations.cfg.disable', so
# mitigations are enabled by default. To disable the mitigations for
# performance reasons, remove the '.disable' suffix from this configuration
# file's name and restart the system. To re-enable them, append '.disable'
# again and restart.
#
# On targets with TPM-sealed disk encryption, renaming this file changes the
# PCR 15 boot measurement. After either rename, run 'ni-reseal-luks' and make
# sure it succeeds before restarting, or the encrypted partitions will not
# unlock on the next boot.
set otherbootargs="${otherbootargs} mitigations=off"
