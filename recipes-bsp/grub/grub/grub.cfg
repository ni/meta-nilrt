# NI Linux RT base-system runmode boot configuration.

set timeout=0
set timeout_style="menu"

search --no-floppy --label --set=root nibootfs
# The environment is mutable; only import target settings used by the boot config.
load_env --skip-sig -f /grub/grubenv consoleoutenable serial_port GRUB_SERIAL_BASE_CLOCK usbgadgetethaddr USBVendorID USBProductID SerialNum USBDevice USBProduct hostname
source /runmode/bootimage.cfg

for cfg_d_file in /runmode/bootimage.cfg.d/*.cfg; do
    if [ -f "$cfg_d_file" ]; then
        source "$cfg_d_file"
    fi
done

if [ -z "$ramdisk_path" -o ! -f "$ramdisk_path" ]; then
    search --no-floppy --label --set=rootfs nirootfs
    # Legacy runmode kernels without an initramfs need a PARTUUID root.
    probe --set=rootuuid --part-uuid ($rootfs)
fi

menuentry "NI Linux RT runmode" {
    if [ -n "$ramdisk_path" -a -f "$ramdisk_path" ]; then
        linux $kernel_path $otherbootargs $usb_gadget_args $consoleparam $othbootargs
        initrd $ramdisk_path
    else
        linux $kernel_path root=PARTUUID=$rootuuid $otherbootargs $usb_gadget_args $consoleparam $othbootargs
    fi
    boot
}
