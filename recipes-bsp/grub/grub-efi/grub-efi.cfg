set timeout=3
set color_normal="light-gray/black"
set color_highlight="light-green/blue"

# The first boot entry in normal boot.
set first_boot="0"

# The default boot entry after the first boot.
set default_boot="0"

function savedefault {
  if [ "${chosen}" ]; then
    next_boot="${chosen}"
    save_env -f "($bootfs)/grub/grubenv" next_boot
  fi
}

# The mutable environment lives on nibootfs, not beside the EFI wrapper.
search --no-floppy --label --set=bootfs nibootfs
if [ -s "($bootfs)/grub/grubenv" ]; then
    load_env -f "($bootfs)/grub/grubenv"
fi

if [ "${next_boot}" ]; then
    set default="${next_boot}"
else
    set default="${first_boot}"
    set next_boot="${default_boot}"
    save_env -f "($bootfs)/grub/grubenv" next_boot
fi

if [ -s "${prefix}/efi-secure-boot.inc" ]; then
    source "${prefix}/efi-secure-boot.inc"
fi

# Use the menu maintained by NILRT's GRUB integration.
source /efi/nilrt/grub.cfg
